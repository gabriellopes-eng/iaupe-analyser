name: Pipeline Runner Daily

on:
  schedule:
    # 13:00 UTC ~= 10:00 Recife/Brasil (sem horario de verao)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Fontes separadas por virgula (finep,facepe,cnpq,capes)"
        required: false
        default: "finep,facepe,cnpq,capes"
      limit_per_source:
        description: "Limite maximo de itens por fonte"
        required: false
        default: "1"
      quota_circuit_breaker_enabled:
        description: "Interrompe as demais fontes quando quota do Gemini esgotar"
        required: false
        default: "true"

jobs:
  run-pipeline-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required configuration
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          REQUIRED_VARS=(
            MONGODB_URI
            MONGODB_DB
            GEMINI_API_KEY
            RECIPIENT_EMAIL
            SMTP_HOST
            SMTP_PORT
            SMTP_USER
            SMTP_PASS
            SENDER_EMAIL
          )

          MISSING=0
          for VAR_NAME in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR_NAME}" ]; then
              echo "Configuracao ausente: $VAR_NAME"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "Falha de configuracao: defina os secrets obrigatorios no repositorio."
            exit 1
          fi

          echo "Configuracoes obrigatorias encontradas."

      - name: Run pipeline for each source
        env:
          PYTHONUNBUFFERED: "1"
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
          MONGODB_ENABLED: ${{ secrets.MONGODB_ENABLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          PIPELINE_SOURCES: ${{ github.event.inputs.sources || 'finep,facepe,cnpq,capes' }}
          PIPELINE_LIMIT_PER_SOURCE: ${{ github.event.inputs.limit_per_source || '1' }}
          QUOTA_CIRCUIT_BREAKER_ENABLED: ${{ github.event.inputs.quota_circuit_breaker_enabled || 'true' }}
        run: |
          cd pipeline
          set -o pipefail

          IFS=',' read -ra SOURCES <<< "$PIPELINE_SOURCES"
          OVERALL_ERRORS=0
          CIRCUIT_OPEN=0

          echo "Inicio da execucao diaria"
          echo "Sources configuradas: $PIPELINE_SOURCES"
          echo "Limite por source: $PIPELINE_LIMIT_PER_SOURCE"
          echo "Quota circuit breaker: $QUOTA_CIRCUIT_BREAKER_ENABLED"

          for RAW_SOURCE in "${SOURCES[@]}"; do
            SOURCE="$(echo "$RAW_SOURCE" | xargs)"
            if [ -z "$SOURCE" ]; then
              continue
            fi

            if [ "$CIRCUIT_OPEN" -eq 1 ]; then
              echo "Circuito aberto: source $SOURCE pulada por quota esgotada."
              continue
            fi

            echo "::group::Processando source: $SOURCE"
            LOG_FILE="$(mktemp)"
            if python -u main.py --source "$SOURCE" --limit "$PIPELINE_LIMIT_PER_SOURCE" 2>&1 | tee "$LOG_FILE"; then
              echo "Source $SOURCE finalizada com sucesso."
            else
              OVERALL_ERRORS=1
              echo "Erro ao processar source $SOURCE. Continuando para a proxima."
            fi

            if [ "$QUOTA_CIRCUIT_BREAKER_ENABLED" = "true" ] || [ "$QUOTA_CIRCUIT_BREAKER_ENABLED" = "1" ]; then
              if grep -Eq "quota_exceeded=[1-9]|quota do Gemini esgotada|Gemini 429 por quota esgotada" "$LOG_FILE"; then
                CIRCUIT_OPEN=1
                echo "Circuito aberto: quota do Gemini detectada. Demais fontes serao interrompidas."
              fi
            fi

            rm -f "$LOG_FILE"
            echo "::endgroup::"
          done

          if [ "$OVERALL_ERRORS" -ne 0 ]; then
            echo "Execucao concluida com falhas em algumas sources."
            exit 1
          elif [ "$CIRCUIT_OPEN" -eq 1 ]; then
            echo "Execucao encerrada por circuito de quota (comportamento esperado)."
          else
            echo "Execucao concluida com sucesso em todas as sources."
          fi
